# Certifications: shown on the Education page; the newest two also appear on the home page.
#
# One entry per certificate. To add one, copy an entry and change the words.
#
#   name     The title exactly as it appears on the certificate.          required
#   issuer   Who issued it, for example Udacity.                          required
#   date     The month it was issued, written like 2020-06.               optional
#   url      A public page that proves it, starting with https://.        optional
#            Only add a link after opening it and checking that it shows
#            this certificate. Never guess one.
#
# Order doesn't matter: the site shows the newest first and undated ones last.

- name: Deep Learning Nanodegree
  issuer: Udacity
  date: 2020-06
  url: https://confirm.udacity.com/EU3T6K3D

- name: Deep Learning Specialization
  issuer: DeepLearning.AI
  date: 2020-06
  url: https://coursera.org/share/7ffdcad290c62a9b4aefff9f414861a5

