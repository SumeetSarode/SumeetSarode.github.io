# Profile: who you are, and the words on the home page and contact page.
#
# This file feeds the header, footer, home page, contact page, and what search engines and
# link previews show. Don't put a phone number or home address here: the site never
# publishes them, and its privacy check will stop the build if one slips in.
#
#   name             Your full name.                                          required
#   title            Role and specialty, joined by " · " (a middle dot).      required
#   url              Where the site is published, starting with https://.     required
#   email            Shown on the Contact page.                                required
#   github           Your GitHub profile link. Leave out to hide it.          optional
#   linkedin         Your LinkedIn profile link. Leave out to hide it.        optional
#   metaDescription  One or two sentences for search results. 155 characters  required
#                    at most; search engines cut off after that.
#
#   hero             The big headline on the home page:
#     role             The small line above your name.                        required
#     setup            First line of the headline.                            required
#     highlight        The word in line two that gets the colourful gradient. required
#     rest             The rest of line two.                                  required
#     intro            One sentence under the headline. Put **two stars**     required
#                      around words to make them bold.
#
#   signature        The "Signature work" section on the home page:
#     headline         One sentence.                                          required
#     highlights       One to three items, each with a title and description. required
#                      Keep each one faithful to a résumé bullet.
#
#   contactNotes     The short line under each contact method. Leave out      optional
#                    any (or all) to use the default wording.
#
# Your photo and its description are handled by Photo Studio (npm run photo).
# Your résumé PDF is built with npm run resume.

