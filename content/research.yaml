# Research papers: each one gets its own page, and they're listed on the Research page.
#
# One entry per paper. To add one, copy a whole entry (from "- title:" down to the
# blank line) and change the words. Only add a link after opening it and checking that
# it shows the right paper. Never guess one.
#
#   title       The paper's title.                                               required
#   slug        The end of the page's web address, like smart-irrigation:        required
#               lowercase words joined by hyphens, different for every paper.
#   venue       Where it was published. A short name in brackets at the end,     required
#               like (IJSR), is used on badges.
#   date        The publication date, written like 2019-08-17.                   required
#   detail      Extra context after the venue, like the conference name.         optional
#   issue       Volume, issue, and pages.                                         optional
#   doi         The paper's DOI, like 10.21275/ART2020571.                       optional
#   url         Where to read the paper, starting with https://.                 optional
#   codeUrl     A public code repository that goes with the paper.               optional
#   coAuthors   The other authors, one per line.                                  optional
#   topic       A short subject line, like IoT / Connected systems.              required
#   emblem      The paper's picture: a big symbol (main), a small badge, and     required
#               a colour (tone: indigo, violet, or cyan). The icon names are
#               listed in src/lib/icon-names.ts.
#   summary     One sentence for the list.                                        required
#   context     The problem, a short paragraph.                                   required
#   approach    What the paper does, a short paragraph.                           required
#   scope       What the paper does not claim, a short paragraph.                 required
#   sources     Extra records, each with a label and a url.                       optional
#
# Long text: write ">-" after the field name, then the text on the next lines,
# indented two spaces more than the field name. Line breaks inside it become spaces.
#
# Order doesn't matter: the site shows the newest paper first.

- title: Stock price prediction using machine learning techniques
  slug: stock-price-prediction
  venue: IEEE
  date: 2019-11-21
  detail: >-
    2019 International Conference on Intelligent Sustainable Systems (ICISS)
  issue: ICISS 2019 · Pages 177–181
  doi: 10.1109/ISS1.2019.8907958
  url: https://ieeexplore.ieee.org/document/8907958/
  coAuthors:
    - Harsha G. Tolani
    - Prateek Kak
    - C. S. Lifna
  topic: Machine learning / Financial forecasting
  emblem:
    main: trending-up
    badge: brain-circuit
    tone: violet
  summary: >-
    Combining LSTM-based stock-price forecasting with sentiment analysis of business news.
  context: >-
    Stock-price forecasting asks how patterns in historical market data can inform estimates
    of future prices. This paper explores that problem through machine learning.
  approach: >-
    The abstract describes LSTM-based stock-price prediction using historical and real-time
    trading data, alongside sentiment analysis of relevant live business news. The two
    analyses are combined to support investor recommendations. This joins a numerical
    time-series signal with the contextual signal in news rather than treating prices as the
    only input.
  scope: >-
    This 2019 publication is separate from my newer Stock Price Predictor software project.
    The two should not be confused, and results from one do not describe the other.
  sources:
    - label: Crossref publication record
      url: https://api.crossref.org/works/10.1109/iss1.2019.8907958
    - label: OpenAlex abstract record
      url: https://api.openalex.org/works/https://doi.org/10.1109/ISS1.2019.8907958

- title: Smart Irrigation Control System
  slug: smart-irrigation
  venue: International Journal of Science and Research (IJSR)
  date: 2019-08-19
  issue: Volume 8, Issue 8 · August 2019 · Pages 1312–1316 · Review paper
  doi: 10.21275/ART2020571
  url: https://www.ijsr.net/getabstract.php?paperid=ART2020571
  topic: IoT / Resource-aware automation
  emblem:
    main: sprout
    badge: cpu
    tone: cyan
  summary: >-
    An IoT irrigation system that switches the water pump on and off from live soil-moisture
    readings.
  context: >-
    Irrigation control is a resource-management problem: deciding when water is needed
    rather than relying only on a fixed schedule.
  approach: >-
    The proposed IoT system measures temperature, humidity, and soil moisture. A
    microcontroller switches a pumping motor on or off in response to soil dampness, while
    valves control the flow and direction of water. The abstract also describes a GSM phone
    connection. The design connects sensing, a control decision, and physical actuation in
    one loop.
  scope: >-
    This is a proposed system, not a claim of a deployed product or measured water savings.

- title: Car Automation using IoT
  slug: car-automation-iot
  venue: International Research Journal of Engineering and Technology (IRJET)
  date: 2019-08-17
  issue: Volume 6, Issue 8 · August 2019 · Starts on page 647
  url: https://www.irjet.net/archives/V6/i8/IRJET-V6I8133.pdf
  topic: IoT / Connected systems
  emblem:
    main: car
    badge: wifi
    tone: indigo
  summary: >-
    Exploring vehicle monitoring and control through IoT, Raspberry Pi, and Arduino.
  context: >-
    Connected vehicle systems bring sensing, monitoring, and control into the same workflow.
    This publication examines that idea through an IoT approach.
  approach: >-
    The paper discusses remote vehicle monitoring and control over an active internet
    connection from a registered user device. Raspberry Pi, Arduino, and other
    microcontrollers are described as platforms for controlling operations. It frames the
    design around concerns including accidents, parking, and theft; these are motivations,
    not measured safety outcomes.
  scope: >-
    The paper discusses a system approach. This portfolio does not claim a commercial
    product, production deployment, or verified field-test results.
  sources:
    - label: Publisher issue archive
      url: https://www.irjet.net/volume-6-issue08

- title: Language Learning Device for blind people
  slug: accessible-language-learning
  venue: >-
    International Journal of Advanced Research in Computer and Communication Engineering
    (IJARCCE)
  date: 2018-07-15
  issue: Volume 7, Issue 6 · June 2018
  doi: 10.17148/IJARCCE.2018.7626
  url: https://www.ijarcce.com/papers/language-learning-device-for-blind-people/
  codeUrl: https://github.com/SumeetSarode/language-learning-device-for-blind
  coAuthors:
    - Harsha G. Tolani
  topic: Assistive technology / Speech translation
  emblem:
    main: languages
    badge: accessibility
    tone: violet
  summary: >-
    A language-learning device concept for blind people, using speech translation with
    Python and Raspberry Pi.
  context: >-
    Language-learning tools that depend on visual interfaces can create barriers for blind
    people. This work explores a speech-oriented approach to language learning.
  approach: >-
    The publisher abstract describes speech translation from one language to another using a
    Raspberry Pi, with application code written in Python. It discusses speech recognition
    and speech-to-text processing, framing spoken interaction as a way to support blind
    users without depending on a visual interface. A related public code repository
    accompanies the work.
  scope: >-
    The publication and code describe the approach. No clinical validation, measured
    learning outcomes, or adoption figures are claimed here.
  sources:
    - label: Publisher PDF
      url: https://www.ijarcce.com/wp-content/uploads/2018/08/10.17148.IJARCCE.2018.7626.pdf
