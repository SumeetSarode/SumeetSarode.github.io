title: Dalal Street
tagline: "Resilience by design: building on data sources you don't control."
summary: A free research terminal for the Indian stock market, built from scratch. Every data source has a fallback chain, so one blocked provider never takes the app down.
metaDescription: 'Case study: a free NSE research terminal with provider fallback chains, a shared service layer for CLI and web, and a transparent rating score.'
order: 2
repoUrl: https://github.com/SumeetSarode/dalal-street
status: Version 1 feature-complete. Runs locally as a CLI and a web app.
tags:
  - Python 3.13
  - FastAPI
  - Jinja2
  - Pydantic v2
  - SQLite
  - typer
  - pytest
checkedOn: 2026-11-10
disclaimer: Educational project. Not financial advice.

# A stock-exchange building, with a life buoy for the fallback chains that keep it afloat.
emblem:
  main: landmark
  badge: life-buoy
  tone: violet

challenge:
  statement: >-
    I wanted a research terminal for Indian stocks that doesn't need a broker account, a
    subscription, or a paywall.
  paragraphs:
    - >-
      OpenBB is the obvious inspiration, but its data stack doesn't cover Indian markets, so I
      built one from scratch.
    - >-
      Indian market data is a patchwork. NSE blocks foreign IP addresses. Free sources rate-limit
      you, go down, or change shape without warning. A terminal that depends on any single source
      will break on the day you need it.

how:
  listTitle: What it does
  list:
    - label: Search, quotes, and charts
      text: for 2,300+ NSE stocks, with an interactive candlestick chart.
    - label: 'Technicals:'
      text: RSI, MACD, 50- and 200-day moving averages, Bollinger Bands, ATR, and 52-week levels.
    - label: Fundamentals,
      text: including promoter pledging and the shareholding pattern.
    - label: A screener
      text: with five ready-made presets over a prebuilt snapshot of the whole market.
    - label: Comparison
      text: of any set of stocks, with the best in each metric highlighted.
    - label: 'Macro views:'
      text: NSE indices and daily FII/DII cash flows.
    - label: Mutual funds
      text: 'from AMFI: scheme search, NAV history, and returns.'
    - label: News and sentiment,
      text: with model-scored sentiment when you add a key.
    - label: The Dalal Score,
      text: a transparent rating that combines technical, fundamental, and sentiment sub-scores.
    - label: One double-click to start.
      text: >-
        After a one-time setup, using the app means double-clicking a desktop icon. It pulls the
        latest reviewed release, refreshes dependencies, and opens the app in the browser. A
        background scheduler keeps the market snapshot fresh without ever blocking startup.
  flow:
    caption: 'Two interfaces share one service layer. Each service reads from sources that can fail.'
    steps:
      - icon: monitor
        title: Two interfaces
        items:
          - Command line (typer)
          - Web app (FastAPI, Jinja, vanilla JavaScript)
      - icon: layers
        title: Shared services
        items:
          - Market and analysis
          - Fundamentals and screener
          - Comparison and funds
          - News and rating
      - icon: plug
        title: Providers, each behind a fallback chain
        items:
          - label: Prices
            chain: [NSE, bhavcopy, yfinance]
          - label: Fundamentals
            chain: [screener.in, yfinance]
          - Mutual funds from AMFI
          - label: News
            chain: [GDELT, Google News RSS]
      - icon: database
        title: Local storage
        items:
          - SQLite snapshot of the whole market
          - Refreshed in the background by a scheduler

highlights:
  - icon: life-buoy
    title: When a source fails, the app doesn't
    summary: Every data source sits behind a chain that tries the next option when one fails.
    paragraphs:
      - >-
        Prices try NSE, then NSE's bhavcopy files, then yfinance. News tries GDELT, then Google
        News RSS. Sentiment tries Gemini, then Groq, then OpenRouter, and quietly shows headlines
        only if no key is set.
      - >-
        The chains are **region-aware.** One setting, `DATA_REGION`, decides whether NSE goes
        first (running from India) or yfinance goes first (everywhere else). The same code runs
        in both places. When something is missing, the app degrades and tells you what's missing
        instead of crashing.
  - icon: split
    title: One engine, two front doors
    summary: The command line and the web app call the same service functions.
    paragraphs:
      - >-
        Providers sit behind small abstract interfaces, so adding or swapping a data source never
        touches a service or a page. Each domain (market, fundamentals, screener, news, rating)
        is one service, and the command line and the web app both call the same functions.
        Neither interface has logic of its own, which means neither can drift out of sync with
        the other.
      - >-
        Math stays pure wherever possible. Technicals, screener filters, and the rating engine
        are plain functions, so the 268 unit tests run with fixtures and fakes. No live network
        is involved.
  - icon: search
    title: A rating you can audit
    summary: The Dalal Score is built from sub-scores with visible weights, not a black box.
    paragraphs:
      - >-
        Stocks get a combined score, and indices get a trend-only variant. The design notes in
        the repo cover the sub-scores, the buckets, and the veto rules. Every rating carries the
        line "educational, not investment advice" in the app and in the command line.

limits:
  - >-
    It is not financial advice, and data can be stale, delayed, or wrong. It runs on your own
    machine and isn't hosted anywhere, and I'm not claiming a user count or any measure of how
    accurate the rating is.
