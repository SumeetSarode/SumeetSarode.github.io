<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS app icons keep a transparent margin (about 10%) so they match other icons in Finder. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#2346d8" />
  <circle cx="512" cy="512" r="270" fill="none" stroke="#ffffff" stroke-width="30" />
  <!-- The clip sits under the ring's stroke so the silhouette tucks beneath it with no seam. -->
  <clipPath id="ring"><circle cx="512" cy="512" r="270" /></clipPath>
  <g clip-path="url(#ring)" fill="#ffffff">
    <circle cx="512" cy="456" r="84" />
    <path d="M338 790c0-108 72-186 174-186s174 78 174 186z" />
  </g>
</svg>
